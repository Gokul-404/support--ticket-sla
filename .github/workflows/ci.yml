name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Test & Build Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: support_ticket_sla
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Server Dependencies
        run: |
          cd server
          bun install

      - name: Generate Prisma Client & Migrate DB
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/support_ticket_sla?schema=public"
          JWT_SECRET: "ci-secret-key-12345"
          BUSINESS_TIMEZONE: "Asia/Kolkata"
        run: |
          cd server
          bunx prisma db push
          bun run seed

      - name: Run Unit & Integration Test Suite
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/support_ticket_sla?schema=public"
          JWT_SECRET: "ci-secret-key-12345"
          BUSINESS_TIMEZONE: "Asia/Kolkata"
        run: |
          cd server
          bun run test

      - name: Build Client App
        run: |
          cd client
          npm install
          npm run build
