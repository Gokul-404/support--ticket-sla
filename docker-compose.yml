version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sla_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: support_ticket_sla
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    container_name: sla_server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/support_ticket_sla?schema=public
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "bunx prisma migrate deploy && bun run seed && bun run start"

  client:
    build:
      context: ./client
    container_name: sla_client
    restart: unless-stopped
    environment:
      VITE_GRAPHQL_ENDPOINT: http://localhost:4000/graphql
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  pg_data:
